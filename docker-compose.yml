services:
  api:
    build:
      context: ./api
    container_name: arche-api
    env_file:
      - ./api/.env
    volumes:
      - api-storage:/var/www/html/storage
      - api-public:/var/www/html/public
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  web:
    build:
      context: ./web
    container_name: arche-web
    env_file:
      - ./web/.env.local
    restart: unless-stopped
    networks:
      - arche

  scheduler:
    build:
      context: ./api
    container_name: arche-scheduler
    env_file:
      - ./api/.env
    volumes:
      - api-storage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  # Le traitement de la file.
  #
  # Ce conteneur tournait en production sans figurer dans aucun fichier : il
  # survivait aux redéploiements comme conteneur orphelin, avec l'image et la
  # configuration de sa création — donc du vieux code, et un fuseau horaire que
  # personne ne mettait plus à jour. Il était aussi à un `--remove-orphans`
  # près de disparaître, et la file se serait arrêtée en silence.
  #
  # `--timeout=300` parce que la réindexation complète de Meilisearch dépasse
  # la minute ; la valeur par défaut la tuerait en plein travail.
  queue-worker:
    build:
      context: ./api
    container_name: arche-queue-worker
    env_file:
      - ./api/.env
    volumes:
      - api-storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=300", "--sleep=3"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  nginx:
    image: nginx:1.27-alpine
    container_name: arche-nginx
    ports:
      - "8090:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - api-public:/var/www/html/public:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - arche

  redis:
    image: redis:7-alpine
    container_name: arche-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - arche

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: arche-meilisearch
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_changemeplease_atLeast16chars}
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped
    networks:
      - arche

volumes:
  api-storage:
  api-public:
  redis-data:
  meili-data:

networks:
  arche:
    driver: bridge
