services:
  redis:
    image: redis:7-alpine
    container_name: outil-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: outil-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

volumes:
  redis-data:
  meili-data:
