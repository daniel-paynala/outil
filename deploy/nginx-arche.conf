# Vhost de l'hôte pour arche.paynala.com.
#
# À placer dans /etc/nginx/sites-available/ du **serveur** (nginx 1.26 d'Ubuntu),
# pas dans la compose : celle-ci a son propre nginx, interne, qui répartit entre
# Laravel et Next.js. Celui-ci ne fait que terminer le TLS et transmettre.
#
# Le routage `/api` → Laravel, reste → Next.js existe déjà à l'intérieur et n'a
# pas à être répété ici : un seul point d'entrée, une seule règle.
#
#   sudo ln -s /etc/nginx/sites-available/arche.paynala.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name arche.paynala.com;

    # Certbot pose son jeton ici. Cette règle doit rester en HTTP même après
    # l'obtention du certificat : c'est par elle que passent les
    # renouvellements, tous les deux mois.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arche.paynala.com;

    # Ces quatre lignes sont écrites par certbot au premier passage.
    # ssl_certificate     /etc/letsencrypt/live/arche.paynala.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/arche.paynala.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Pièces jointes : 10 Mo pour la messagerie interne, 25 Mo pour un envoi
    # Gmail. La marge couvre le surcoût de l'encodage multipart, qui gonfle le
    # corps d'environ un tiers — un fichier de 25 Mo passe la barre des 30.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Indispensable : sans cet en-tête, Laravel ne voit que la connexion
        # HTTP interne et génère des liens absolus en `http://`. Le lien
        # marche, ce qui rend le défaut invisible.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js utilise des connexions persistantes en développement, et
        # certains flux de l'app restent ouverts.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # La recherche et la synchronisation GitHub peuvent dépasser la minute
        # par défaut. Un délai atteint se manifeste par un 504 qui ne dit rien
        # de sa cause.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Un téléversement ne doit pas être mis en tampon sur disque avant
        # d'atteindre PHP : cela double le temps ressenti sur un réseau lent.
        proxy_request_buffering off;
    }
}
