# Vhost de l'hôte pour arche.paynala.com.
#
# À placer dans /etc/nginx/sites-available/ du **serveur** (nginx 1.26 d'Ubuntu),
# pas dans la compose : celle-ci a son propre nginx, interne, qui répartit entre
# Laravel et Next.js. Celui-ci ne fait que terminer le TLS et transmettre.
#
# Le routage `/api` → Laravel, reste → Next.js existe déjà à l'intérieur et n'a
# pas à être répété ici : un seul point d'entrée, une seule règle.
#
# ## Pourquoi ce fichier ne parle que du port 80
#
# Un bloc `listen 443 ssl` sans `ssl_certificate` fait échouer `nginx -t`, et le
# certificat n'existe pas avant le premier passage de certbot. Écrire les deux
# blocs à la main crée donc une impasse.
#
# `certbot --nginx` lit ce bloc, en fabrique un second en 443 avec les mêmes
# directives, y ajoute les chemins du certificat et pose la redirection depuis
# le 80. C'est le fonctionnement prévu, et il évite d'avoir à maintenir la
# configuration TLS soi-même — y compris lors des renouvellements.
#
#   sudo ln -s /etc/nginx/sites-available/arche.paynala.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arche.paynala.com

server {
    listen 80;
    listen [::]:80;
    server_name arche.paynala.com;

    # Pièces jointes : 10 Mo pour la messagerie interne, 25 Mo pour un envoi
    # Gmail. La marge couvre le surcoût de l'encodage multipart, qui gonfle le
    # corps d'environ un tiers — un fichier de 25 Mo passe la barre des 30.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Indispensable : sans cet en-tête, Laravel ne voit que la connexion
        # HTTP interne et génère des liens absolus en `http://`. Le lien
        # marche, ce qui rend le défaut invisible.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # La recherche et la synchronisation GitHub peuvent dépasser la minute
        # par défaut. Un délai atteint se manifeste par un 504 qui ne dit rien
        # de sa cause.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Un téléversement ne doit pas être mis en tampon sur disque avant
        # d'atteindre PHP : cela double le temps ressenti sur un réseau lent.
        proxy_request_buffering off;
    }
}
