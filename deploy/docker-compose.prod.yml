# Déploiement Arche en production.
#
# Ce fichier était jusqu'ici absent du dépôt : le serveur est passé de
# systemd + PHP-FPM à Docker sans que rien ne le consigne. La conséquence a
# été concrète — `deploy/arche-queue.service` décrivait un worker qui
# n'existait plus, ce qui a fait croire que les notifications partaient alors
# qu'aucun processus ne consommait la file.
#
# Le `docker-compose.yml` de la racine reste celui du développement local
# (Redis et Meilisearch seuls). Celui-ci décrit la production.

services:
  api:
    build:
      context: ./api
    container_name: arche-api
    env_file:
      - ./api/.env
    volumes:
      - api-storage:/var/www/html/storage
      - api-public:/var/www/html/public
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  web:
    build:
      context: ./web
    container_name: arche-web
    env_file:
      - ./web/.env.local
    restart: unless-stopped
    networks:
      - arche

  scheduler:
    build:
      context: ./api
    container_name: arche-scheduler
    env_file:
      - ./api/.env
    volumes:
      - api-storage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  # Consommateur de la file d'attente.
  #
  # Sans lui, chaque envoi de message empile un `SendMessagePush` que personne
  # ne traite : aucune erreur, aucun `failed_jobs`, aucun log — juste des
  # notifications qui n'arrivent jamais. La sonde `/api/monitoring/queue` rend
  # désormais cette panne visible, mais mieux vaut qu'elle n'arrive pas.
  #
  # `--queue=default` seul : Arche ne déclare aucune autre file.
  # `--timeout=120` : l'appel à OneSignal est plafonné à 8 s côté code, un
  # délai serré fait remonter les blocages plutôt que de les laisser traîner.
  # `--max-time=3600` : PHP fuit sur un processus long, on le relance chaque
  # heure — d'où les cinq minutes de tolérance de la sonde.
  queue-worker:
    build:
      context: ./api
    container_name: arche-queue-worker
    env_file:
      - ./api/.env
    volumes:
      - api-storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3", "--timeout=120", "--sleep=3", "--max-time=3600"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  nginx:
    image: nginx:1.27-alpine
    container_name: arche-nginx
    ports:
      - "8090:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - api-public:/var/www/html/public:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - arche

  redis:
    image: redis:7-alpine
    container_name: arche-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - arche

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: arche-meilisearch
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_changemeplease_atLeast16chars}
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped
    networks:
      - arche

volumes:
  api-storage:
  api-public:
  redis-data:
  meili-data:

networks:
  arche:
    driver: bridge
