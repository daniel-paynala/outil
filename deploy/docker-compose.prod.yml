# ⚠ CE FICHIER N'EST PAS CELUI QUI TOURNE EN PRODUCTION.
#
# La production utilise `docker-compose.yml`, à la racine du dépôt. Celui-ci
# décrit une topologie parallèle qui n'a jamais été déployée — et il a coûté un
# diagnostic entier : `APP_TIMEZONE: UTC` y est déclaré depuis mai, ce qui a
# laissé croire pendant des semaines que le fuseau était réglé alors que le
# serveur lisait `api/.env`, où il valait `Europe/Paris`.
#
# Ce qu'il garde d'utile et qu'on ne trouve nulle part ailleurs : la définition
# du service `coturn`, le relais des appels. Tant qu'elle n'a pas rejoint le
# compose racine, ne pas supprimer ce fichier.
#
# Ce qu'il faut en retenir : la seule source de vérité pour ce qui tourne est
# `docker-compose.yml` à la racine, et la configuration de l'API vient de
# `api/.env` — pas d'une variable d'environnement déclarée ici.

# Déploiement Arche en production.
#
# Ce fichier était jusqu'ici absent du dépôt : le serveur est passé de
# systemd + PHP-FPM à Docker sans que rien ne le consigne. La conséquence a
# été concrète — `deploy/arche-queue.service` décrivait un worker qui
# n'existait plus, ce qui a fait croire que les notifications partaient alors
# qu'aucun processus ne consommait la file.
#
# Le `docker-compose.yml` de la racine reste celui du développement local
# (Redis et Meilisearch seuls). Celui-ci décrit la production.

# Environnement commun aux trois conteneurs PHP — API, planificateur, worker.
#
# ## Pourquoi le cache doit être Redis
#
# Le middleware d'authentification garde un instantané court de chaque compte
# pour éviter un aller-retour vers Supabase Francfort à *chaque* requête —
# mesuré à 160 ms depuis Libreville, sur tous les écrans. Ce gain n'existe que
# si le cache est local. Avec `CACHE_STORE=database`, la valeur par défaut de
# Laravel, le cache *est* la base distante : l'instantané se relit au prix
# exact de la ligne qu'il remplace, et l'opération devient neutre. Redis tourne
# déjà ici, sur le même hôte, à quelques dixièmes de milliseconde.
#
# ## Pourquoi la valeur est partagée, et non posée sur l'API seule
#
# Le cache sert aussi de canal entre les conteneurs. Le worker y écrit l'heure
# du dernier job traité et l'issue du dernier push ; l'API les relit pour
# `/api/monitoring/queue` et `/api/monitoring/push`. Deux magasins différents
# et les sondes ne verraient plus rien — elles annonceraient une file morte et
# des notifications jamais parties, alors que tout fonctionne. Le pire des
# diagnostics : un faux positif dans l'outil censé dire la vérité.
x-php-env: &php-env
  CACHE_STORE: redis

  # ## Pourquoi UTC et non Europe/Paris
  #
  # Les colonnes de date sont des `timestamp without time zone` : elles ne
  # portent aucun fuseau, seulement des chiffres. Laravel y écrivait l'heure de
  # Paris, alors que l'horloge de PostgreSQL est en UTC — deux heures d'écart
  # entre ce que la base croit être l'heure et ce qu'elle contient.
  #
  # Entre Laravel et lui-même, c'était cohérent : il écrivait Paris, il relisait
  # Paris. Le défaut n'apparaissait qu'à la sortie — **le temps réel de la
  # messagerie**. Supabase y transmet la valeur brute de la colonne, sans
  # fuseau ; l'app la lit comme de l'UTC, et un message reçu en direct
  # s'affichait deux heures trop tôt, avant de se corriger seul au
  # rafraîchissement, l'API sérialisant, elle, avec le décalage.
  #
  # Invisible en développement, où le fuseau est déjà UTC. C'est ce qui l'a fait
  # passer inaperçu.
  #
  # La règle est de stocker en UTC et d'afficher en local — l'app formate déjà
  # avec `toLocal()`. Rien à changer côté client.
  APP_TIMEZONE: UTC

services:
  api:
    build:
      context: ./api
    container_name: arche-api
    env_file:
      - ./api/.env
    environment: *php-env
    volumes:
      - api-storage:/var/www/html/storage
      - api-public:/var/www/html/public
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  web:
    build:
      context: ./web
    container_name: arche-web
    env_file:
      - ./web/.env.local
    restart: unless-stopped
    networks:
      - arche

  scheduler:
    build:
      context: ./api
    container_name: arche-scheduler
    env_file:
      - ./api/.env
    environment: *php-env
    volumes:
      - api-storage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  # Consommateur de la file d'attente.
  #
  # Sans lui, chaque envoi de message empile un `SendMessagePush` que personne
  # ne traite : aucune erreur, aucun `failed_jobs`, aucun log — juste des
  # notifications qui n'arrivent jamais. La sonde `/api/monitoring/queue` rend
  # désormais cette panne visible, mais mieux vaut qu'elle n'arrive pas.
  #
  # `--queue=default` seul : Arche ne déclare aucune autre file.
  # `--timeout=120` : l'appel à OneSignal est plafonné à 8 s côté code, un
  # délai serré fait remonter les blocages plutôt que de les laisser traîner.
  # `--max-time=3600` : PHP fuit sur un processus long, on le relance chaque
  # heure — d'où les cinq minutes de tolérance de la sonde.
  queue-worker:
    build:
      context: ./api
    container_name: arche-queue-worker
    env_file:
      - ./api/.env
    environment: *php-env
    volumes:
      - api-storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=3", "--timeout=120", "--sleep=3", "--max-time=3600"]
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - arche

  nginx:
    image: nginx:1.27-alpine
    container_name: arche-nginx
    ports:
      # Lié à la boucle locale : seul le nginx de l'hôte, qui termine le TLS,
      # peut atteindre ce port. Sans cette restriction, `http://<ip>:8090`
      # resterait ouvert en clair à côté du HTTPS — et c'est le chemin en clair
      # que trouvent les outils d'analyse, pas celui qu'on a pris soin de
      # chiffrer. C'est aussi ce qui rend `trustProxies(at: '*')` correct.
      - "127.0.0.1:8090:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - api-public:/var/www/html/public:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - arche

  # Relais TURN pour les appels internes.
  #
  # ## Pourquoi `network_mode: host`
  #
  # Un relais TURN attribue dynamiquement un port UDP par flux. Publier une
  # plage par la traduction d'adresses de Docker fonctionne mal — chaque paquet
  # est réécrit, et coturn annonce alors des adresses que le pair ne peut pas
  # joindre. Le mode hôte lui donne directement la pile réseau de la machine,
  # ce qui est la configuration recommandée et la seule qui se comporte bien.
  #
  # La contrepartie est qu'il ignore le réseau `arche` : c'est sans importance,
  # il ne parle à aucun autre conteneur.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: arche-coturn
    network_mode: host
    volumes:
      - ./deploy/coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped

  # Redis porte à la fois la file d'attente et, depuis l'ajout de
  # `CACHE_STORE: redis`, le cache applicatif.
  #
  # ⚠ `allkeys-lru` évince n'importe quelle clé sous pression mémoire — y
  # compris les listes de la file, donc des jobs jamais exécutés et sans trace.
  # À cinq utilisateurs, 128 Mo ne seront jamais atteints (un instantané de
  # compte pèse ~1 ko et vit 60 s), et le sujet est théorique. S'il devait le
  # devenir, la réponse est `volatile-lru` — qui n'évince que les clés portant
  # une expiration, c'est-à-dire le cache et jamais la file.
  redis:
    image: redis:7-alpine
    container_name: arche-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - arche

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: arche-meilisearch
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_changemeplease_atLeast16chars}
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped
    networks:
      - arche

volumes:
  api-storage:
  api-public:
  redis-data:
  meili-data:

networks:
  arche:
    driver: bridge
