# Serveur de relais TURN pour les appels internes d'Arche.
#
# ## À quoi il sert exactement
#
# Deux téléphones tentent toujours de se parler **directement** : c'est le
# chemin le plus rapide, et depuis Libreville il évite un détour par l'Europe
# qui ajouterait 300 ms à chaque mot. Mais un réseau sur quatre l'interdit —
# NAT symétrique, pare-feu d'entreprise, certains opérateurs mobiles. Sans
# relais, l'appel sonne et la voix ne passe jamais : la panne la plus
# déroutante qui soit.
#
# coturn n'entre en jeu que dans ces cas-là. Sur un appel qui passe en direct,
# il ne voit rien et ne consomme rien.

listening-port=3478
tls-listening-port=5349

# ## Authentification par secret partagé, et non par mot de passe
#
# Un mot de passe figé dans l'application serait extractible de n'importe quel
# APK, et n'importe qui pourrait alors se servir de ce serveur comme relais
# gratuit — la bande passante est facturée, pas le logiciel.
#
# Ici, l'API signe des identifiants valables quelques heures : le secret ne
# quitte jamais le serveur. Voir `CallController::turnCredentials`.
use-auth-secret
static-auth-secret=ea74c22c7e1192f743813cb5901fc2ee8b34ac36f959648b46dec6722c7666a7

realm=arche.paynala.com

# Plage de ports pour le trafic relayé. Volontairement étroite : chaque appel
# en consomme quelques-uns, et à cinq personnes cent ports sont très larges.
min-port=49160
max-port=49260

# ## Refus des adresses internes
#
# Sans ces lignes, quelqu'un pourrait demander au relais d'ouvrir une connexion
# vers 127.0.0.1 ou vers le réseau privé du serveur — et s'en servir pour
# atteindre la base de données ou l'API depuis l'extérieur. C'est la faille
# classique d'un TURN mal configuré.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Pas de relais vers la boucle locale, ni multicast.
no-loopback-peers
no-multicast-peers

# Un seul appel ouvre deux allocations ; la marge couvre les reconnexions.
user-quota=12
total-quota=100

# Journal minimal : un TURN bavard écrit des mégaoctets par jour pour des
# informations que personne ne lit.
no-cli
simple-log
log-file=stdout
