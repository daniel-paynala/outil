# Arche — nginx config (single host, IP-based, HTTP only)
# Routes : /api/* → Laravel (PHP-FPM)  ·  reste → Next.js (port 3000)

upstream nextjs_upstream {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;

  # Sécurité de base
  server_tokens off;
  client_max_body_size 50m;

  # Headers communs
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml application/json
    application/javascript application/x-javascript
    application/xml application/xml+rss
    application/atom+xml image/svg+xml;

  # ─────── API Laravel : /api/* + /up ───────
  location ^~ /api/ {
    root /var/www/arche/source/api/public;
    try_files $uri /index.php?$query_string;
  }

  location = /up {
    root /var/www/arche/source/api/public;
    try_files $uri /index.php?$query_string;
  }

  location ~ ^/(api/|up).*\.php$ {
    root /var/www/arche/source/api/public;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME /var/www/arche/source/api/public/index.php;
    include fastcgi_params;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 60s;
  }

  # Laravel sub-internal — index.php fallback (catch-all api routes)
  location @laravel {
    root /var/www/arche/source/api/public;
    rewrite ^/(.*)$ /index.php?/$1 last;
  }

  # ─────── Next.js : tout le reste ───────
  # Statics Next bundle
  location /_next/static/ {
    proxy_pass http://nextjs_upstream;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, immutable, max-age=31536000";
  }

  # Static images / favicon / assets dans public/
  location ~* \.(?:ico|css|js|gif|jpg|jpeg|png|svg|webp|woff2?|ttf|map)$ {
    proxy_pass http://nextjs_upstream;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # SSR / API routes Next.js
  location / {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }

  # Block hidden files
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }
}
