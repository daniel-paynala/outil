# Arche — nginx config (single host, IP-based, HTTP only)
# Routes : /api/* + /up → Laravel (PHP-FPM)  ·  reste → Next.js (port 3000)

upstream nextjs_upstream {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;

  # Sécurité de base
  server_tokens off;
  client_max_body_size 50m;

  # Headers communs
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml application/json
    application/javascript application/x-javascript
    application/xml application/xml+rss
    application/atom+xml image/svg+xml;

  # ─────── Laravel API : /api/* + /up ───────
  # Toute requête commençant par /api/ ou /up → passe à @laravel (PHP-FPM)
  location ~ ^/(api|up)(/|$) {
    root /var/www/arche/source/api/public;
    try_files $uri @laravel;
  }

  location @laravel {
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME /var/www/arche/source/api/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param SERVER_PORT $server_port;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param REMOTE_PORT $remote_port;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 60s;
  }

  # ─────── Next.js : tout le reste ───────
  location /_next/static/ {
    proxy_pass http://nextjs_upstream;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, immutable, max-age=31536000";
  }

  location ~* \.(?:ico|css|js|gif|jpg|jpeg|png|svg|webp|woff2?|ttf|map)$ {
    proxy_pass http://nextjs_upstream;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }

  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }
}
